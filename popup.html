<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel</title>
  <link rel="stylesheet" href="ui.css" />
</head>

<body>
  <div class="container">
    <header class="header">
      <h1>Nova AI</h1>
      <span class="tagline">AI Powered Page Reader</span>
    </header>

    <section class="status-section">
      <div class="status-indicator">
        <span class="status-dot status-idle" id="statusDot"></span>
        <span class="status-text" id="statusText">Ready</span>
      </div>
    </section>

    <section class="controls">
      <div class="controls-group">
        <button id="explainBtn" class="primary-btn">
          <span class="btn-icon">▶</span>
          Explain Page
        </button>
        <select id="voiceSelector" class="voice-selector">
          <option value="default">Default Voice</option>
          <option value="qwen">Qwen Presenter</option>
        </select>
      </div>

      <div class="playback-controls" id="playbackControls" style="display: none;">
        <button id="stopBtn" class="secondary-btn">
          ⏹ Stop
        </button>
      </div>
    </section>

    <section class="info-section" id="infoSection" style="display: none;">
      <p id="infoText"></p>
    </section>

    <footer class="footer">
      <small>
        Built by
        <a href="https://github.com/tharuzika" target="_blank">TharuZika</a>
      </small>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
